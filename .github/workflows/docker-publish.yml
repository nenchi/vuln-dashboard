name: Test, build and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:          # Renovate PRs: tests only, nothing published
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    # 26.04 too until ubuntu-latest has switched to it (rollout ends 2026-11-19), then drop the matrix
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Unit tests
        run: |
          python3 app/test_app.py
          python3 test_publish.py

      - name: Release tag matches app VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)".*/\1/p' app/app.py)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but app/app.py says $v"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: vuln-dashboard:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          cp -r tests/fixture/state /tmp/state
          chmod -R a+rwX /tmp/state
          docker run -d --name vd -p 8080:80 -v /tmp/state:/srv/state vuln-dashboard:test
          # the image's own healthcheck command, run now instead of waiting a minute
          for i in $(seq 20); do docker exec vd wget -qO /dev/null http://127.0.0.1/healthz && break; sleep 1; done
          docker exec vd wget -qO /dev/null http://127.0.0.1/healthz
          python3 tests/smoke_test.py http://127.0.0.1:8080 || { docker logs vd; exit 1; }

      # the dashboard checks itself: real Trivy scan of this image via publish.py, real CISA KEV download
      - name: Self-scan with Trivy + real CISA KEV
        env:
          STATE_DIR: /tmp/state
          REPO_NAME: vuln-dashboard
          IMAGES: vuln-dashboard:test
          TRIVY_IMAGE: aquasec/trivy:0.69.3   # renovate: datasource=docker depName=aquasec/trivy
        run: |
          python3 publish.py
          python3 tests/selfscan_test.py http://127.0.0.1:8080 vuln-dashboard

      - name: Container log
        if: always()
        run: docker logs vd || true

  # A Renovate merge that changed the base image (e.g. Python 3.13.8 → 3.13.9) → next patch release.
  # Renovate merges only after the test job passed on its PR (renovate.json), and test ran again above.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Bump version if the base image changed
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sh .github/scripts/auto-release.sh

      - name: Push release commit + tag, create GitHub Release
        if: steps.bump.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.bump.outputs.version }}
        run: |
          git push origin HEAD:main "v$V"
          gh release create "v$V" --title "v$V" --notes-file release-notes.md

  publish:
    needs: [test, release]
    # release is skipped on normal pushes and tags; publish still runs then
    if: always() && needs.test.result == 'success' && github.event_name != 'pull_request' && needs.release.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # a push by github.token starts no new workflow run, so an automatic release is built here, from its tag
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.version && format('v{0}', needs.release.outputs.version) || github.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # main pushes → latest; v* tags and automatic releases → x.y.z and latest
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ needs.release.outputs.version }},enable=${{ needs.release.outputs.version != '' }}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
