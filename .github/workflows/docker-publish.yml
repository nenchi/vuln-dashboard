name: Test, build and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:          # Renovate PRs: tests only, nothing published
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Unit tests
        run: |
          python3 app/test_app.py
          python3 test_publish.py

      - name: Release tag matches app VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)".*/\1/p' app/app.py)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but app/app.py says $v"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: vuln-dashboard:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          cp -r tests/fixture/state /tmp/state
          docker run -d --name vd -p 8080:80 -v /tmp/state:/srv/state vuln-dashboard:test
          # the image's own healthcheck command, run now instead of waiting a minute
          for i in $(seq 20); do docker exec vd wget -qO /dev/null http://127.0.0.1/healthz && break; sleep 1; done
          docker exec vd wget -qO /dev/null http://127.0.0.1/healthz
          python3 tests/smoke_test.py http://127.0.0.1:8080 || { docker logs vd; exit 1; }

      - name: Container log
        if: always()
        run: docker logs vd || true

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # main pushes → latest; v* tags → x.y.z and latest
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
